version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: 'build(deps)'
    groups:
      development-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: 'build(actions)'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
