name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: gitblocks_test
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitblocks_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      COREPACK_DEFAULT_TO_LATEST: '0'
      GITBLOCKS_DB_TEST_ACK: ephemeral
      GITBLOCKS_TEST_DB_DATABASE: gitblocks_test
      GITBLOCKS_TEST_DB_HOST: 127.0.0.1
      GITBLOCKS_TEST_DB_OWNER: postgres
      GITBLOCKS_TEST_DB_PASSWORD: postgres-test-only
      GITBLOCKS_TEST_DB_PORT: '5432'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable exact pnpm with Corepack
        run: corepack enable pnpm

      - name: Verify package manager
        run: test "$(pnpm --version)" = "11.17.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove standalone typecheck from a clean checkout
        run: pnpm typecheck

      - name: Prove installation is reproducible
        run: git diff --exit-code

      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        env:
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm repo:pr-branch -- "$PR_ACTOR" "$PR_BRANCH"
          pnpm repo:pr-title -- "$PR_TITLE"

      - name: Run authoritative verification
        run: pnpm verify:ci

      - name: Prove verification leaves the worktree unchanged
        run: git diff --exit-code
